# Pipeline de integração contínua do painel web.
# Roda em todo push para o main e em todo pull request: instala as
# dependências e gera o build de produção. O ESLint roda só como aviso,
# porque ainda há erros de estilo conhecidos (ver README).
name: Build do painel web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (somente aviso)
        run: npx eslint src
        continue-on-error: true

      - name: Build de produção
        run: npm run build
        env:
          VITE_APP_API_URL: http://127.0.0.1:8000/api
